<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               user-scalable=yes">

<title>Earth Flat Map</title>

<style>
html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#071522;
    font-family:Arial,sans-serif;
}

#earth{
    width:100%;
    height:100%;
    touch-action:none;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    padding:14px 20px;
    background:rgba(0,0,0,0.75);
    color:#fff;
    border-radius:12px;
    font-size:16px;
    z-index:20;
    text-align:center;
}

#error{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:80%;
    padding:18px;
    background:#6d1111;
    color:#fff;
    border-radius:12px;
    text-align:center;
    z-index:30;
}

#title{
    position:fixed;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    color:white;
    background:rgba(0,0,0,0.45);
    padding:8px 14px;
    border-radius:10px;
    font-size:15px;
    z-index:10;
}
</style>
</head>

<body>

<div id="earth"></div>

<div id="title">
    الأرض مسطحة ثلاثية الأبعاد
</div>

<div id="loading">
    جاري تحميل القارات...
</div>

<div id="error">
    تعذر تحميل ملف القارات.
</div>

<!-- المكتبات -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/d3-geo@3/dist/d3-geo.min.js"></script>

<script>

const container = document.getElementById("earth");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");

/* إنشاء المشهد */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x071522);


/* الكاميرا */

const camera = new THREE.OrthographicCamera(
    -1,1,1,-1,0,10
);

camera.position.z = 5;


/* المحرك */

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
    container.clientWidth,
    container.clientHeight
);

container.appendChild(renderer.domElement);


/* المجموعة التي ستحتوي القارات */

const landGroup = new THREE.Group();

scene.add(landGroup);


/* إسقاط الخريطة */

let projection;

function createProjection(){

    const width = container.clientWidth;
    const height = container.clientHeight;

    projection = d3.geoNaturalEarth1()
        .fitSize(
            [width * 0.95, height * 0.80],
            {
                type:"Sphere"
            }
        );
}


/* رسم مضلع */

function drawPolygon(coordinates){

    const shape = new THREE.Shape();

    let first = true;

    for(const point of coordinates){

        const xy = projection(point);

        if(!xy) continue;

        const x =
            (xy[0] - container.clientWidth/2)
            / (container.clientHeight/2);

        const y =
            -(xy[1] - container.clientHeight/2)
            / (container.clientHeight/2);

        if(first){

            shape.moveTo(x,y);

            first = false;

        }else{

            shape.lineTo(x,y);
        }
    }

    if(first) return;


    const geometry =
        new THREE.ShapeGeometry(shape);


    const material =
        new THREE.MeshBasicMaterial({
            color:0x4fa3d1,
            side:THREE.DoubleSide
        });


    const mesh =
        new THREE.Mesh(
            geometry,
            material
        );


    landGroup.add(mesh);
}


/* رسم القارات */

      
function drawGeometry(geometry){

    if(!geometry) return;

    if(geometry.type === "Polygon"){

        drawPolygon(geometry.coordinates[0]);

    }

    else if(geometry.type === "MultiPolygon"){

        for(const polygon of geometry.coordinates){

            if(polygon && polygon[0]){

                drawPolygon(polygon[0]);

            }
        }
    }
}


/* تحميل ملف القارات المحلي */

async function loadLand(){

    try{

        loading.style.display = "block";

        errorBox.style.display = "none";


        /*
         * مهم جداً:
         * الملف موجود داخل نفس مستودع GitHub
         */

        const response =
            await fetch("land-50m.json");


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );
        }


        const topology =
            await response.json();


        /*
         * نأخذ أول مجموعة جغرافية
         * موجودة داخل ملف TopoJSON
         */

        const objectName =
            Object.keys(topology.objects)[0];


        const land =
            topojson.feature(
                topology,
                topology.objects[objectName]
            );


        createProjection();


        /* تنظيف أي رسم قديم */

        while(landGroup.children.length > 0){

            landGroup.remove(
                landGroup.children[0]
            );
        }


        /* رسم القارات */

        if(land.features){

            for(const feature of land.features){

                drawGeometry(feature.geometry);
            }

        }else{

            drawGeometry(land.geometry);
        }


        loading.style.display = "none";


    }catch(e){

        console.error(e);

loading.style.display = "none";

errorBox.style.display = "block";

errorBox.innerHTML =
    "خطأ: " + e.message;
    }
    } 


/* السحب */

let dragging = false;

let lastX = 0;
let lastY = 0;


renderer.domElement.addEventListener(
    "pointerdown",
    function(e){

        dragging = true;

        lastX = e.clientX;
        lastY = e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointermove",
    function(e){

        if(!dragging) return;

        const dx =
            e.clientX - lastX;

        const dy =
            e.clientY - lastY;

        landGroup.position.x +=
            dx / container.clientHeight;

        landGroup.position.y -=
            dy / container.clientHeight;

        lastX = e.clientX;
        lastY = e.clientY;
    }
);


renderer.domElement.addEventListener(
    "pointerup",
    function(){

        dragging = false;
    }
);


renderer.domElement.addEventListener(
    "pointercancel",
    function(){

        dragging = false;
    }
);


/* التكبير */

renderer.domElement.addEventListener(
    "wheel",
    function(e){

        e.preventDefault();

        const scale =
            e.deltaY > 0 ? 0.9 : 1.1;

        landGroup.scale.multiplyScalar(scale);

        landGroup.scale.x =
            Math.max(
                0.4,
                Math.min(5,landGroup.scale.x)
            );

        landGroup.scale.y =
            landGroup.scale.x;

        landGroup.scale.z =
            landGroup.scale.x;
    },
    {passive:false}
);


/* إعادة ضبط الحجم */

window.addEventListener(
    "resize",
    function(){

        renderer.setSize(
            container.clientWidth,
            container.clientHeight
        );

        createProjection();
    }
);


/* الحلقة */

function animate(){

    requestAnimationFrame(animate);

    renderer.render(
        scene,
        camera
    );
}


/* تشغيل */

loadLand();

animate();

</script>

</body>
      </html>

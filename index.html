<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Blue Circle</title>

<style>

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;

    background:#063b55;

}

#app{

    width:100%;
    height:100%;

    display:flex;

    align-items:center;
    justify-content:center;

    touch-action:none;

}

canvas{

    display:block;

}

</style>

</head>

<body>

<div id="app"></div>

<script>

/* =========================================
   Canvas
========================================= */

const canvas =
    document.createElement("canvas");

const ctx =
    canvas.getContext("2d");

document
    .getElementById("app")
    .appendChild(canvas);


/* =========================================
   حجم الشاشة
========================================= */

function resize(){

    canvas.width =
        window.innerWidth *
        window.devicePixelRatio;

    canvas.height =
        window.innerHeight *
        window.devicePixelRatio;

    canvas.style.width =
        window.innerWidth + "px";

    canvas.style.height =
        window.innerHeight + "px";

    draw();

}


/* =========================================
   إعدادات الدائرة
========================================= */

let scale = 1;

const minScale = 0.5;

const maxScale = 2.5;


/* =========================================
   رسم الدائرة
========================================= */

function draw(){

    const width =
        window.innerWidth;

    const height =
        window.innerHeight;

    ctx.setTransform(
        window.devicePixelRatio,
        0,
        0,
        window.devicePixelRatio,
        0,
        0
    );

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* مركز الشاشة */

    const centerX =
        width / 2;

    const centerY =
        height / 2;


    /* حجم الدائرة */

    const baseRadius =
        Math.min(
            width,
            height
        ) * 0.30;

    const radius =
        baseRadius * scale;


    /* =====================================
       الدائرة الزرقاء
    ===================================== */

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#087fae";

    ctx.fill();


    /* =====================================
       الإطار الأبيض
    ===================================== */

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        radius,
        0,
        Math.PI * 2
    );

    ctx.strokeStyle =
        "#ffffff";

    ctx.lineWidth =
        6;

    ctx.stroke();

}


/* =========================================
   التكبير بإصبعين
========================================= */

let oldDistance = null;


function distance(touches){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


canvas.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 2
        ){

            oldDistance =
                distance(e.touches);

        }

    },
    {passive:false}
);


canvas.addEventListener(
    "touchmove",
    function(e){

        if(
            e.touches.length !== 2
        ){

            return;

        }

        e.preventDefault();


        const newDistance =
            distance(e.touches);


        if(
            oldDistance !== null
        ){

            const difference =
                newDistance -
                oldDistance;


            scale +=
                difference * 0.005;


            scale =
                Math.max(
                    minScale,
                    Math.min(
                        maxScale,
                        scale
                    )
                );


            draw();

        }


        oldDistance =
            newDistance;

    },
    {passive:false}
);


canvas.addEventListener(
    "touchend",
    function(e){

        if(
            e.touches.length < 2
        ){

            oldDistance =
                null;

        }

    },
    {passive:false}
);


/* =========================================
   تشغيل
========================================= */

window.addEventListener(
    "resize",
    resize
);

resize();

</script>

</body>
</html>

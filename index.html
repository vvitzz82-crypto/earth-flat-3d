<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Earth Circle Map</title>

<style>

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#071522;
}

#earth{
    width:100%;
    height:100%;
    touch-action:none;
}

canvas{
    display:block;
}

</style>
</head>

<body>

<div id="earth"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   المشهد
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x071522);


/* =====================================================
   الكاميرا
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

let cameraDistance = 10;

camera.position.set(
    0,
    0,
    cameraDistance
);

camera.lookAt(0,0,0);


/* =====================================================
   Renderer
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("earth")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   خريطة الدائرة
===================================================== */

const mapCanvas =
    document.createElement("canvas");

mapCanvas.width = 2400;
mapCanvas.height = 2400;

const ctx =
    mapCanvas.getContext("2d");


/* =====================================================
   البحر
===================================================== */

const ocean =
    ctx.createRadialGradient(
        1200,
        1000,
        100,
        1200,
        1200,
        1500
    );

ocean.addColorStop(
    0,
    "#168fbd"
);

ocean.addColorStop(
    0.45,
    "#086d99"
);

ocean.addColorStop(
    0.75,
    "#045274"
);

ocean.addColorStop(
    1,
    "#02344f"
);

ctx.fillStyle =
    ocean;

ctx.fillRect(
    0,
    0,
    2400,
    2400
);


/* =====================================================
   دائرة الأرض
===================================================== */

const centerX = 1200;
const centerY = 1200;
const radius = 1080;


/* =====================================================
   قص الخريطة داخل الدائرة
===================================================== */

ctx.save();

ctx.beginPath();

ctx.arc(
    centerX,
    centerY,
    radius,
    0,
    Math.PI * 2
);

ctx.clip();


/* =====================================================
   القارات
===================================================== */

ctx.fillStyle =
    "#55a84f";

ctx.strokeStyle =
    "#b9d98b";

ctx.lineWidth =
    7;


/* أمريكا الشمالية */

ctx.beginPath();

ctx.moveTo(350,650);
ctx.lineTo(450,500);
ctx.lineTo(650,430);
ctx.lineTo(850,520);
ctx.lineTo(920,680);
ctx.lineTo(820,790);
ctx.lineTo(670,780);
ctx.lineTo(560,900);
ctx.lineTo(420,850);
ctx.lineTo(330,740);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أمريكا الجنوبية */

ctx.beginPath();

ctx.moveTo(850,980);
ctx.lineTo(1010,1030);
ctx.lineTo(1080,1200);
ctx.lineTo(1030,1450);
ctx.lineTo(930,1700);
ctx.lineTo(800,1550);
ctx.lineTo(760,1350);
ctx.lineTo(790,1160);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أوروبا */

ctx.beginPath();

ctx.moveTo(1050,600);
ctx.lineTo(1180,520);
ctx.lineTo(1350,550);
ctx.lineTo(1430,650);
ctx.lineTo(1340,730);
ctx.lineTo(1180,720);
ctx.lineTo(1080,680);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* آسيا */

ctx.beginPath();

ctx.moveTo(1330,540);
ctx.lineTo(1600,480);
ctx.lineTo(1900,560);
ctx.lineTo(2130,720);
ctx.lineTo(2070,870);
ctx.lineTo(1850,900);
ctx.lineTo(1650,820);
ctx.lineTo(1460,750);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أفريقيا */

ctx.beginPath();

ctx.moveTo(1160,800);
ctx.lineTo(1340,820);
ctx.lineTo(1430,1040);
ctx.lineTo(1370,1290);
ctx.lineTo(1230,1510);
ctx.lineTo(1080,1370);
ctx.lineTo(1040,1120);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أستراليا */

ctx.beginPath();

ctx.moveTo(1700,1390);
ctx.lineTo(1910,1340);
ctx.lineTo(2100,1440);
ctx.lineTo(2080,1600);
ctx.lineTo(1900,1670);
ctx.lineTo(1710,1580);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* =====================================================
   الجزر الرئيسية
===================================================== */

ctx.fillStyle =
    "#69b75a";

ctx.strokeStyle =
    "#b9d98b";

ctx.lineWidth =
    5;


function island(
    x,
    y,
    rx,
    ry
){

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        rx,
        ry,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();

}


/* بريطانيا */

island(
    1020,
    560,
    35,
    60
);


/* اليابان */

island(
    1950,
    820,
    35,
    75
);


/* مدغشقر */

island(
    1500,
    1380,
    45,
    110
);


/* نيوزيلندا */

island(
    2110,
    1740,
    30,
    70
);


/* أيسلندا */

island(
    900,
    400,
    55,
    30
);


/* =====================================================
   خطوط خفيفة للمحيطات
===================================================== */

ctx.strokeStyle =
    "rgba(180,230,255,0.16)";

ctx.lineWidth = 3;


/* خطوط عرض */

for(
    let y = 300;
    y < 2200;
    y += 180
){

    ctx.beginPath();

    ctx.moveTo(
        100,
        y
    );

    ctx.lineTo(
        2300,
        y
    );

    ctx.stroke();

}


/* خطوط طول */

for(
    let x = 300;
    x < 2200;
    x += 180
){

    ctx.beginPath();

    ctx.moveTo(
        x,
        100
    );

    ctx.lineTo(
        x,
        2300
    );

    ctx.stroke();

}


ctx.restore();


/* =====================================================
   لمعة داخل البحر
===================================================== */

const shine =
    ctx.createRadialGradient(
        850,
        650,
        50,
        850,
        650,
        1100
    );

shine.addColorStop(
    0,
    "rgba(255,255,255,0.20)"
);

shine.addColorStop(
    0.45,
    "rgba(255,255,255,0.06)"
);

shine.addColorStop(
    1,
    "rgba(255,255,255,0)"
);

ctx.save();

ctx.beginPath();

ctx.arc(
    centerX,
    centerY,
    radius,
    0,
    Math.PI * 2
);

ctx.clip();

ctx.fillStyle =
    shine;

ctx.fillRect(
    0,
    0,
    2400,
    2400
);

ctx.restore();


/* =====================================================
   Texture
===================================================== */

const texture =
    new THREE.CanvasTexture(
        mapCanvas
    );

texture.colorSpace =
    THREE.SRGBColorSpace;

texture.anisotropy =
    renderer.capabilities.getMaxAnisotropy();


/* =====================================================
   الدائرة الرئيسية
===================================================== */

const geometry =
    new THREE.CircleGeometry(
        5,
        256
    );

const material =
    new THREE.MeshBasicMaterial({
        map:texture,
        side:THREE.DoubleSide
    });

const earth =
    new THREE.Mesh(
        geometry,
        material
    );

scene.add(
    earth
);


/* =====================================================
   الحافة البيضاء
===================================================== */

const borderGeometry =
    new THREE.RingGeometry(
        5.00,
        5.055,
        256
    );

const borderMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff,
        side:THREE.DoubleSide
    });

const border =
    new THREE.Mesh(
        borderGeometry,
        borderMaterial
    );

border.position.z =
    0.03;

scene.add(
    border
);


/* =====================================================
   دوران أفقي فقط
===================================================== */

let dragging = false;

let previousX = 0;

let rotation = 0;


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 1
        ){

            dragging = true;

            previousX =
                e.touches[0].clientX;

        }

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            !dragging ||
            e.touches.length !== 1
        ){
            return;
        }

        e.preventDefault();

        const x =
            e.touches[0].clientX;

        const dx =
            x - previousX;

        rotation +=
            dx * 0.005;

        earth.rotation.z =
            rotation;

        border.rotation.z =
            rotation;

        previousX = x;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchend",
    function(){

        dragging = false;

    }
);


/* =====================================================
   التكبير والتصغير بإصبعين
===================================================== */

let oldDistance = null;


function getDistance(touches){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 2
        ){

            oldDistance =
                getDistance(
                    e.touches
                );

        }

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            e.touches.length !== 2
        ){
            return;
        }

        e.preventDefault();

        const distance =
            getDistance(
                e.touches
            );

        if(
            oldDistance !== null
        ){

            cameraDistance -=
                (
                    distance -
                    oldDistance
                ) * 0.015;

            cameraDistance =
                Math.max(
                    7,
                    Math.min(
                        18,
                        cameraDistance
                    )
                );

            camera.position.z =
                cameraDistance;

        }

        oldDistance =
            distance;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchend",
    function(e){

        if(
            e.touches.length < 2
        ){

            oldDistance = null;

        }

    }
);


/* =====================================================
   تغيير حجم الشاشة
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   التشغيل
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Earth Circle Test</title>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #020914;
}

#earth {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
}

.circle {
    width: 280px;
    height: 280px;
    border-radius: 50%;
    background: radial-gradient(
        circle at 35% 30%,
        #35bde8,
        #087aa8 55%,
        #034266 100%
    );

    box-shadow:
        0 0 25px rgba(40,190,255,0.45),
        inset -25px -20px 45px rgba(0,0,0,0.35),
        inset 15px 15px 30px rgba(255,255,255,0.12);

    flex-shrink: 0;
}
</style>
</head>

<body>

<div id="earth">
    <div class="circle"></div>
</div>

<script>

const circle = document.querySelector(".circle");

let scale = 1;
let oldDistance = null;


/* حساب المسافة بين إصبعين */
function getDistance(touches) {

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx + dy * dy
    );
}


/* بداية اللمس */
circle.addEventListener(
    "touchstart",
    function(e) {

        if (e.touches.length === 2) {

            oldDistance =
                getDistance(e.touches);

        }

    },
    { passive: false }
);


/* التكبير والتصغير */
circle.addEventListener(
    "touchmove",
    function(e) {

        if (e.touches.length !== 2) {
            return;
        }

        e.preventDefault();

        const distance =
            getDistance(e.touches);

        if (oldDistance !== null) {

            const change =
                distance - oldDistance;

            scale += change * 0.005;

            scale =
                Math.max(
                    0.5,
                    Math.min(
                        2.5,
                        scale
                    )
                );

            circle.style.transform =
                "scale(" + scale + ")";

        }

        oldDistance = distance;

    },
    { passive: false }
);


/* نهاية اللمس */
circle.addEventListener(
    "touchend",
    function(e) {

        if (e.touches.length < 2) {
            oldDistance = null;
        }

    },
    { passive: false }
);

</script>

</body>
</html>

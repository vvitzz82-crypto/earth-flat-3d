<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Earth Flat 3D</title>

<style>

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#020914;
}

#earth{
    width:100%;
    height:100%;
    touch-action:none;
}

canvas{
    display:block;
}

</style>

</head>

<body>

<div id="earth"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   المشهد
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x020914);


/* =====================================================
   الكاميرا
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

let cameraDistance = 12;

camera.position.set(
    0,
    0,
    cameraDistance
);

camera.lookAt(0,0,0);


/* =====================================================
   Renderer
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("earth")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   النجوم
===================================================== */

const starGeometry =
    new THREE.BufferGeometry();

const starCount = 2200;

const starPositions =
    new Float32Array(
        starCount * 3
    );

for(let i=0;i<starCount;i++){

    const radius =
        45 + Math.random()*100;

    const theta =
        Math.random()*Math.PI*2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    starPositions[i*3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    starPositions[i*3+1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    starPositions[i*3+2] =
        radius *
        Math.cos(phi);
}

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color:0xffffff,
        size:0.10,
        transparent:true,
        opacity:0.8
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


/* =====================================================
   خريطة القرص
===================================================== */

const mapCanvas =
    document.createElement("canvas");

mapCanvas.width = 2048;
mapCanvas.height = 2048;

const ctx =
    mapCanvas.getContext("2d");


/* =====================================================
   البحر
===================================================== */

const ocean =
    ctx.createRadialGradient(
        1024,
        900,
        100,
        1024,
        1024,
        1050
    );

ocean.addColorStop(
    0,
    "#27b8df"
);

ocean.addColorStop(
    0.45,
    "#087da8"
);

ocean.addColorStop(
    0.75,
    "#045274"
);

ocean.addColorStop(
    1,
    "#022f50"
);

ctx.fillStyle =
    ocean;

ctx.fillRect(
    0,
    0,
    2048,
    2048
);


/* =====================================================
   شبكة خطوط الطول والعرض
===================================================== */

ctx.strokeStyle =
    "rgba(180,235,255,0.14)";

ctx.lineWidth = 3;


/* خطوط أفقية */

for(let y=180;y<1900;y+=170){

    ctx.beginPath();

    ctx.ellipse(
        1024,
        1024,
        820,
        Math.abs(y-1024)*0.45 + 40,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();
}


/* خطوط عمودية */

for(let x=220;x<1900;x+=170){

    ctx.beginPath();

    ctx.ellipse(
        1024,
        1024,
        Math.abs(x-1024)*0.55 + 35,
        820,
        0,
        0,
        Math.PI*2
    );

    ctx.stroke();
}


/* =====================================================
   القارات
===================================================== */

ctx.fillStyle =
    "#62a944";

ctx.strokeStyle =
    "#9bce73";

ctx.lineWidth = 5;


/* أمريكا الشمالية */

ctx.beginPath();

ctx.moveTo(300,500);
ctx.lineTo(390,350);
ctx.lineTo(600,300);
ctx.lineTo(760,390);
ctx.lineTo(720,530);
ctx.lineTo(620,610);
ctx.lineTo(520,590);
ctx.lineTo(430,700);
ctx.lineTo(340,650);
ctx.closePath();

ctx.fill();
ctx.stroke();


/* أمريكا الجنوبية */

ctx.beginPath();

ctx.moveTo(600,760);
ctx.lineTo(720,780);
ctx.lineTo(770,950);
ctx.lineTo(720,1160);
ctx.lineTo(620,1390);
ctx.lineTo(530,1260);
ctx.lineTo(510,1080);
ctx.lineTo(550,900);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أوروبا */

ctx.beginPath();

ctx.moveTo(900,440);
ctx.lineTo(1010,370);
ctx.lineTo(1130,410);
ctx.lineTo(1180,490);
ctx.lineTo(1100,550);
ctx.lineTo(980,530);
ctx.lineTo(900,490);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* آسيا */

ctx.beginPath();

ctx.moveTo(1080,390);
ctx.lineTo(1310,330);
ctx.lineTo(1540,400);
ctx.lineTo(1740,530);
ctx.lineTo(1680,670);
ctx.lineTo(1480,700);
ctx.lineTo(1300,620);
ctx.lineTo(1150,540);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أفريقيا */

ctx.beginPath();

ctx.moveTo(900,610);
ctx.lineTo(1050,590);
ctx.lineTo(1130,750);
ctx.lineTo(1080,960);
ctx.lineTo(990,1160);
ctx.lineTo(880,1040);
ctx.lineTo(850,850);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أستراليا */

ctx.beginPath();

ctx.moveTo(1390,1050);
ctx.lineTo(1560,1010);
ctx.lineTo(1740,1090);
ctx.lineTo(1710,1220);
ctx.lineTo(1550,1280);
ctx.lineTo(1400,1200);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* =====================================================
   الجزر
===================================================== */

ctx.fillStyle =
    "#79b957";

function island(x,y,r){

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* اليابان */

island(1690,650,22);


/* مدغشقر */

island(1150,1060,35);


/* بريطانيا */

island(870,430,18);


/* أيسلندا */

island(760,300,15);


/* نيوزيلندا */

island(1760,1340,25);


/* جزر إضافية */

island(1330,760,13);
island(1370,800,10);
island(1800,850,12);
island(430,820,13);
island(460,880,9);


/* =====================================================
   لمعة البحر
===================================================== */

const shine =
    ctx.createRadialGradient(
        700,
        520,
        50,
        700,
        520,
        1000
    );

shine.addColorStop(
    0,
    "rgba(255,255,255,0.22)"
);

shine.addColorStop(
    0.5,
    "rgba(255,255,255,0.06)"
);

shine.addColorStop(
    1,
    "rgba(255,255,255,0)"
);

ctx.fillStyle =
    shine;

ctx.fillRect(
    0,
    0,
    2048,
    2048
);


/* =====================================================
   Texture
===================================================== */

const texture =
    new THREE.CanvasTexture(
        mapCanvas
    );

texture.colorSpace =
    THREE.SRGBColorSpace;


/* =====================================================
   القرص المسطح ثلاثي الأبعاد
===================================================== */

const diskGeometry =
    new THREE.CylinderGeometry(
        5,
        5,
        0.28,
        160,
        1,
        false
    );


/* =====================================================
   مواد القرص
===================================================== */

const sideMaterial =
    new THREE.MeshPhongMaterial({
        color:0x063a55
    });


const topMaterial =
    new THREE.MeshPhongMaterial({
        map:texture,
        shininess:22
    });


const bottomMaterial =
    new THREE.MeshPhongMaterial({
        color:0x03283d
    });


const earth =
    new THREE.Mesh(
        diskGeometry,
        [
            sideMaterial,
            topMaterial,
            bottomMaterial
        ]
    );


/* القرص مواجه للكاميرا */

earth.rotation.x =
    Math.PI / 2;


/* رفع بسيط */

earth.position.z = 0;

scene.add(earth);


/* =====================================================
   حافة جليدية حول القرص
===================================================== */

const rimGeometry =
    new THREE.TorusGeometry(
        5.02,
        0.12,
        12,
        160
    );


const rimMaterial =
    new THREE.MeshPhongMaterial({
        color:0x9de9ff,
        shininess:80
    });


const rim =
    new THREE.Mesh(
        rimGeometry,
        rimMaterial
    );


rim.position.z =
    0.18;

scene.add(rim);


/* =====================================================
   ضوء الشمس
===================================================== */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.4
    );

sun.position.set(
    6,
    8,
    10
);

scene.add(sun);


/* =====================================================
   إضاءة عامة
===================================================== */

const ambient =
    new THREE.AmbientLight(
        0x4b89a8,
        0.55
    );

scene.add(ambient);


/* =====================================================
   الدوران باللمس
===================================================== */

let dragging = false;

let previousX = 0;

let previousY = 0;

let rotationSpeed = 0;


/* لمس واحد */

renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(e.touches.length === 1){

            dragging = true;

            previousX =
                e.touches[0].clientX;

            previousY =
                e.touches[0].clientY;
        }

    },
    {passive:false}
);


/* تحريك */

renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            !dragging ||
            e.touches.length !== 1
        ){
            return;
        }

        e.preventDefault();

        const x =
            e.touches[0].clientX;

        const y =
            e.touches[0].clientY;

        const dx =
            x - previousX;

        const dy =
            y - previousY;


        rotationSpeed =
            dx * 0.005;


        earth.rotation.z +=
            rotationSpeed;

        rim.rotation.z =
            earth.rotation.z;


        /*
           حركة خفيفة للأعلى والأسفل
        */

        earth.rotation.y +=
            dy * 0.0015;

        rim.rotation.y =
            earth.rotation.y;


        previousX = x;

        previousY = y;

    },
    {passive:false}
);


/* نهاية اللمس */

renderer.domElement.addEventListener(
    "touchend",
    function(){

        dragging = false;

    }
);


/* =====================================================
   التكبير بإصبعين
===================================================== */

let oldDistance = null;


function getDistance(touches){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx*dx + dy*dy
    );
}


/* بداية إصبعين */

renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(e.touches.length === 2){

            oldDistance =
                getDistance(
                    e.touches
                );
        }

    },
    {passive:false}
);


/* تكبير */

renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(e.touches.length !== 2){
            return;
        }

        e.preventDefault();

        const distance =
            getDistance(
                e.touches
            );

        if(oldDistance !== null){

            cameraDistance -=
                (
                    distance -
                    oldDistance
                ) * 0.018;


            cameraDistance =
                Math.max(
                    7,
                    Math.min(
                        20,
                        cameraDistance
                    )
                );


            camera.position.z =
                cameraDistance;

        }

        oldDistance =
            distance;

    },
    {passive:false}
);


/* نهاية إصبعين */

renderer.domElement.addEventListener(
    "touchend",
    function(e){

        if(e.touches.length < 2){

            oldDistance = null;

        }

    }
);


/* =====================================================
   التشغيل
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    /*
       دوران تلقائي خفيف
    */

    if(!dragging){

        earth.rotation.z +=
            0.0005;

        rim.rotation.z =
            earth.rotation.z;
    }


    stars.rotation.y +=
        0.00003;


    renderer.render(
        scene,
        camera
    );
}

animate();


/* =====================================================
   تغيير حجم الشاشة
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>

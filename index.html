<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=5.0,
               user-scalable=yes">

<title>Earth Flat Map</title>

<style>

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#071522;
}

#earth{
    width:100%;
    height:100%;
    touch-action:none;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);

    padding:12px 18px;

    background:rgba(0,0,0,0.7);

    color:#fff;

    border-radius:12px;

    font-family:Arial,sans-serif;

    font-size:16px;

    z-index:20;
}

#error{
    display:none;

    position:fixed;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:80%;

    padding:16px;

    background:#6d1111;

    color:#fff;

    border-radius:12px;

    text-align:center;

    font-family:Arial,sans-serif;

    z-index:30;
}

</style>

</head>

<body>

<div id="earth"></div>

<div id="loading">
    جاري تحميل القارات...
</div>

<div id="error">
    تعذر تحميل ملف القارات المحلي.
</div>


<!-- Three.js -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- TopoJSON -->

<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<!-- D3 Geo -->

<script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>


<script>

/* =====================================================
   المشهد
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x071522
    );


/* =====================================================
   الكاميرا
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        100
    );

let cameraDistance = 10;

camera.position.set(
    0,
    0,
    cameraDistance
);

camera.lookAt(
    0,
    0,
    0
);


/* =====================================================
   Renderer
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        3
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("earth")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   Canvas
===================================================== */

const mapCanvas =
    document.createElement(
        "canvas"
    );

mapCanvas.width =
    4096;

mapCanvas.height =
    4096;

const ctx =
    mapCanvas.getContext(
        "2d"
    );


/* =====================================================
   مركز الدائرة
===================================================== */

const centerX =
    2048;

const centerY =
    2048;

const mapRadius =
    1900;


/* =====================================================
   البحر
===================================================== */

const ocean =
    ctx.createRadialGradient(
        1300,
        900,
        100,
        centerX,
        centerY,
        2900
    );

ocean.addColorStop(
    0,
    "#35c9ee"
);

ocean.addColorStop(
    0.20,
    "#16a7d5"
);

ocean.addColorStop(
    0.45,
    "#0a84b2"
);

ocean.addColorStop(
    0.70,
    "#075d86"
);

ocean.addColorStop(
    1,
    "#02334f"
);

ctx.fillStyle =
    ocean;

ctx.fillRect(
    0,
    0,
    4096,
    4096
);


/* =====================================================
   قص داخل الدائرة
===================================================== */

ctx.save();

ctx.beginPath();

ctx.arc(
    centerX,
    centerY,
    mapRadius,
    0,
    Math.PI * 2
);

ctx.clip();


/* =====================================================
   الإسقاط الجغرافي
===================================================== */

const projection =
    d3.geoAzimuthalEquidistant()
      .rotate([
          0,
          -90
      ])
      .translate([
          centerX,
          centerY
      ])
      .scale(
          1150
      );


/* =====================================================
   مسار الخريطة
===================================================== */

const path =
    d3.geoPath(
        projection,
        ctx
    );


/* =====================================================
   شبكة خفيفة
===================================================== */

ctx.save();

ctx.strokeStyle =
    "rgba(220,245,255,0.13)";

ctx.lineWidth =
    3;

const graticule =
    d3.geoGraticule()
      .step([
          15,
          15
      ]);

ctx.beginPath();

path(
    graticule()
);

ctx.stroke();

ctx.restore();


/* =====================================================
   Texture
===================================================== */

const texture =
    new THREE.CanvasTexture(
        mapCanvas
    );

texture.colorSpace =
    THREE.SRGBColorSpace;

texture.anisotropy =
    renderer
        .capabilities
        .getMaxAnisotropy();

texture.minFilter =
    THREE.LinearMipmapLinearFilter;

texture.magFilter =
    THREE.LinearFilter;


/* =====================================================
   القرص
===================================================== */

const earthGeometry =
    new THREE.CircleGeometry(
        5,
        512
    );

const earthMaterial =
    new THREE.MeshBasicMaterial({

        map:
            texture,

        side:
            THREE.DoubleSide

    });

const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );

scene.add(
    earth
);


/* =====================================================
   الحافة البيضاء
===================================================== */

const borderGeometry =
    new THREE.RingGeometry(
        5.00,
        5.08,
        512
    );

const borderMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0xffffff,

        side:
            THREE.DoubleSide

    });

const border =
    new THREE.Mesh(
        borderGeometry,
        borderMaterial
    );

border.position.z =
    0.03;

scene.add(
    border
);


/* =====================================================
   تحميل الملف المحلي
===================================================== */

fetch(
    "./land-50m.json"
)

.then(
    response => {

        if(
            !response.ok
        ){

            throw new Error(
                "land-50m.json not found"
            );

        }

        return response.json();

    }
)

.then(
    world => {

        if(
            !world.objects ||
            !world.objects.land
        ){

            throw new Error(
                "Invalid TopoJSON"
            );

        }


        const land =
            topojson.feature(
                world,
                world.objects.land
            );


        /* =============================================
           القارات والجزر
        ============================================= */

        ctx.save();

        ctx.fillStyle =
            "#67b34e";

        ctx.strokeStyle =
            "#d5eca2";

        ctx.lineWidth =
            4;


        ctx.beginPath();

        path(
            land
        );

        ctx.fill();

        ctx.stroke();

        ctx.restore();


        /* =============================================
           تظليل بسيط لليابسة
        ============================================= */

        ctx.save();

        ctx.beginPath();

        path(
            land
        );

        ctx.clip();


        const landLight =
            ctx.createRadialGradient(
                1250,
                850,
                60,
                1250,
                850,
                2200
            );

        landLight.addColorStop(
            0,
            "rgba(255,255,220,0.25)"
        );

        landLight.addColorStop(
            0.4,
            "rgba(255,255,255,0.07)"
        );

        landLight.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle =
            landLight;

        ctx.fillRect(
            0,
            0,
            4096,
            4096
        );

        ctx.restore();


        /* =============================================
           لمعان البحر
        ============================================= */

        ctx.save();

        ctx.beginPath();

        ctx.arc(
            centerX,
            centerY,
            mapRadius,
            0,
            Math.PI * 2
        );

        ctx.clip();


        const waterLight =
            ctx.createRadialGradient(
                1100,
                700,
                80,
                1100,
                700,
                2400
            );

        waterLight.addColorStop(
            0,
            "rgba(255,255,255,0.12)"
        );

        waterLight.addColorStop(
            0.45,
            "rgba(255,255,255,0.035)"
        );

        waterLight.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle =
            waterLight;

        ctx.fillRect(
            0,
            0,
            4096,
            4096
        );

        ctx.restore();


        /* =============================================
           تحديث Texture
        ============================================= */

        texture.needsUpdate =
            true;


        document
            .getElementById("loading")
            .style.display =
                "none";

    }
)

.catch(
    error => {

        console.error(
            error
        );

        document
            .getElementById("loading")
            .style.display =
                "none";

        document
            .getElementById("error")
            .style.display =
                "block";

    }
);


/* =====================================================
   دوران أفقي فقط
===================================================== */

let dragging =
    false;

let previousX =
    0;

let rotation =
    0;


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 1
        ){

            dragging =
                true;

            previousX =
                e.touches[0].clientX;

        }

    },
    {
        passive:false
    }
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            !dragging ||
            e.touches.length !== 1
        ){

            return;

        }

        e.preventDefault();


        const x =
            e.touches[0].clientX;


        const dx =
            x - previousX;


        rotation +=
            dx * 0.005;


        earth.rotation.z =
            rotation;

        border.rotation.z =
            rotation;


        previousX =
            x;

    },
    {
        passive:false
    }
);


renderer.domElement.addEventListener(
    "touchend",
    function(){

        dragging =
            false;

    }
);


/* =====================================================
   Zoom واسع
===================================================== */

let oldDistance =
    null;


function getDistance(
    touches
){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 2
        ){

            oldDistance =
                getDistance(
                    e.touches
                );

        }

    },
    {
        passive:false
    }
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            e.touches.length !== 2
        ){

            return;

        }

        e.preventDefault();


        const distance =
            getDistance(
                e.touches
            );


        if(
            oldDistance !== null
        ){

            cameraDistance -=
                (
                    distance -
                    oldDistance
                ) * 0.020;


            cameraDistance =
                Math.max(
                    5,
                    Math.min(
                        40,
                        cameraDistance
                    )
                );


            camera.position.z =
                cameraDistance;

        }


        oldDistance =
            distance;

    },
    {
        passive:false
    }
);


renderer.domElement.addEventListener(
    "touchend",
    function(e){

        if(
            e.touches.length < 2
        ){

            oldDistance =
                null;

        }

    }
);


/* =====================================================
   تغيير حجم الشاشة
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   التشغيل
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>

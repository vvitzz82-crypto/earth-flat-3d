<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Earth Graphic 3D</title>

<style>

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#010711;
}

#earth{
    width:100%;
    height:100%;
    touch-action:none;
}

canvas{
    display:block;
}

</style>

</head>

<body>

<div id="earth"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   المشهد
===================================================== */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x010711);


/* =====================================================
   الكاميرا
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

let distance = 12;

camera.position.set(
    0,
    0,
    distance
);

camera.lookAt(
    0,
    0,
    0
);


/* =====================================================
   Renderer
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
.getElementById("earth")
.appendChild(
    renderer.domElement
);


/* =====================================================
   نجوم
===================================================== */

const starsGeometry =
    new THREE.BufferGeometry();

const starCount = 2200;

const positions =
    new Float32Array(
        starCount * 3
    );

for(
    let i = 0;
    i < starCount;
    i++
){

    const r =
        60 + Math.random()*90;

    const a =
        Math.random()*Math.PI*2;

    const b =
        Math.acos(
            2*Math.random()-1
        );

    positions[i*3] =
        r *
        Math.sin(b) *
        Math.cos(a);

    positions[i*3+1] =
        r *
        Math.sin(b) *
        Math.sin(a);

    positions[i*3+2] =
        r *
        Math.cos(b);
}

starsGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        positions,
        3
    )
);

const starsMaterial =
    new THREE.PointsMaterial({
        color:0xffffff,
        size:0.12,
        transparent:true,
        opacity:0.85
    });

const stars =
    new THREE.Points(
        starsGeometry,
        starsMaterial
    );

scene.add(
    stars
);


/* =====================================================
   خريطة عالية الدقة
===================================================== */

const canvas =
    document.createElement("canvas");

canvas.width = 4096;
canvas.height = 2048;

const ctx =
    canvas.getContext("2d");


/* =====================================================
   البحر
===================================================== */

const ocean =
    ctx.createLinearGradient(
        0,
        0,
        0,
        2048
    );

ocean.addColorStop(
    0,
    "#159ac7"
);

ocean.addColorStop(
    0.25,
    "#087da8"
);

ocean.addColorStop(
    0.55,
    "#07557d"
);

ocean.addColorStop(
    0.8,
    "#063b61"
);

ocean.addColorStop(
    1,
    "#021b35"
);

ctx.fillStyle =
    ocean;

ctx.fillRect(
    0,
    0,
    4096,
    2048
);


/* =====================================================
   شبكة جغرافية
===================================================== */

ctx.strokeStyle =
    "rgba(170,225,255,0.16)";

ctx.lineWidth = 2;


/* خطوط العرض */

for(
    let y = 170;
    y < 2048;
    y += 170
){

    ctx.beginPath();

    ctx.moveTo(
        0,
        y
    );

    ctx.lineTo(
        4096,
        y
    );

    ctx.stroke();
}


/* خطوط الطول */

for(
    let x = 170;
    x < 4096;
    x += 170
){

    ctx.beginPath();

    ctx.moveTo(
        x,
        0
    );

    ctx.lineTo(
        x,
        2048
    );

    ctx.stroke();
}


/* =====================================================
   القارات
===================================================== */

ctx.fillStyle =
    "#4f9b48";

ctx.strokeStyle =
    "#b5dc91";

ctx.lineWidth = 4;


/* أمريكا الشمالية */

ctx.beginPath();

ctx.moveTo(350,500);
ctx.lineTo(470,390);
ctx.lineTo(650,350);
ctx.lineTo(820,420);
ctx.lineTo(930,520);
ctx.lineTo(850,650);
ctx.lineTo(720,680);
ctx.lineTo(620,760);
ctx.lineTo(480,700);
ctx.lineTo(390,620);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أمريكا الجنوبية */

ctx.beginPath();

ctx.moveTo(900,820);
ctx.lineTo(1050,790);
ctx.lineTo(1130,900);
ctx.lineTo(1100,1080);
ctx.lineTo(1030,1260);
ctx.lineTo(930,1400);
ctx.lineTo(850,1280);
ctx.lineTo(830,1120);
ctx.lineTo(860,970);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أوروبا */

ctx.beginPath();

ctx.moveTo(1770,480);
ctx.lineTo(1880,410);
ctx.lineTo(2020,420);
ctx.lineTo(2130,480);
ctx.lineTo(2070,550);
ctx.lineTo(1920,560);
ctx.lineTo(1810,530);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* آسيا */

ctx.beginPath();

ctx.moveTo(2020,430);
ctx.lineTo(2250,350);
ctx.lineTo(2550,370);
ctx.lineTo(2850,450);
ctx.lineTo(3160,560);
ctx.lineTo(3300,700);
ctx.lineTo(3150,790);
ctx.lineTo(2860,760);
ctx.lineTo(2600,690);
ctx.lineTo(2300,620);
ctx.lineTo(2100,550);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أفريقيا */

ctx.beginPath();

ctx.moveTo(1900,650);
ctx.lineTo(2070,620);
ctx.lineTo(2180,760);
ctx.lineTo(2150,950);
ctx.lineTo(2080,1150);
ctx.lineTo(1980,1320);
ctx.lineTo(1880,1190);
ctx.lineTo(1820,990);
ctx.lineTo(1840,800);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* أستراليا */

ctx.beginPath();

ctx.moveTo(2860,1120);
ctx.lineTo(3040,1060);
ctx.lineTo(3240,1110);
ctx.lineTo(3350,1230);
ctx.lineTo(3270,1340);
ctx.lineTo(3050,1370);
ctx.lineTo(2880,1290);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* =====================================================
   الجزر
===================================================== */

function island(
    x,
    y,
    rx,
    ry
){

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        rx,
        ry,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
    ctx.stroke();

}


/* بريطانيا */

island(
    1740,
    430,
    30,
    55
);


/* أيسلندا */

island(
    1580,
    330,
    45,
    25
);


/* اليابان */

island(
    3250,
    700,
    25,
    70
);


/* مدغشقر */

island(
    2220,
    1160,
    35,
    90
);


/* نيوزيلندا */

island(
    3440,
    1450,
    25,
    70
);


/* =====================================================
   مناطق خضراء إضافية
===================================================== */

ctx.fillStyle =
    "rgba(115,180,70,0.65)";


for(
    let i = 0;
    i < 180;
    i++
){

    const x =
        300 +
        Math.random()*3400;

    const y =
        350 +
        Math.random()*1100;

    const r =
        3 +
        Math.random()*12;

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   لمعة المحيط
===================================================== */

const oceanLight =
    ctx.createRadialGradient(
        1200,
        450,
        50,
        1200,
        450,
        1700
    );

oceanLight.addColorStop(
    0,
    "rgba(255,255,255,0.20)"
);

oceanLight.addColorStop(
    0.4,
    "rgba(255,255,255,0.06)"
);

oceanLight.addColorStop(
    1,
    "rgba(255,255,255,0)"
);

ctx.fillStyle =
    oceanLight;

ctx.fillRect(
    0,
    0,
    4096,
    2048
);


/* =====================================================
   Texture
===================================================== */

const texture =
    new THREE.CanvasTexture(
        canvas
    );

texture.colorSpace =
    THREE.SRGBColorSpace;


/* =====================================================
   الأرض
===================================================== */

const earthGeometry =
    new THREE.SphereGeometry(
        5,
        192,
        192
    );

const earthMaterial =
    new THREE.MeshPhongMaterial({

        map:
            texture,

        shininess:
            25,

        specular:
            new THREE.Color(
                0x174b66
            )

    });

const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );

scene.add(
    earth
);


/* =====================================================
   الشمس
===================================================== */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.6
    );

sun.position.set(
    8,
    5,
    10
);

scene.add(
    sun
);


/* =====================================================
   إضاءة عامة
===================================================== */

const ambient =
    new THREE.AmbientLight(
        0x477d99,
        0.5
    );

scene.add(
    ambient
);


/* =====================================================
   الغلاف الجوي
===================================================== */

const atmosphereGeometry =
    new THREE.SphereGeometry(
        5.13,
        128,
        128
    );

const atmosphereMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0x2aaeff,

        transparent:
            true,

        opacity:
            0.12,

        side:
            THREE.BackSide

    });

const atmosphere =
    new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
    );

scene.add(
    atmosphere
);


/* =====================================================
   اللمعان الخارجي
===================================================== */

const glowGeometry =
    new THREE.SphereGeometry(
        5.25,
        96,
        96
    );

const glowMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0x168ed1,

        transparent:
            true,

        opacity:
            0.045,

        side:
            THREE.BackSide

    });

const glow =
    new THREE.Mesh(
        glowGeometry,
        glowMaterial
    );

scene.add(
    glow
);


/* =====================================================
   التحكم باللمس
===================================================== */

let dragging =
    false;

let lastX = 0;
let lastY = 0;

let oldDistance =
    null;


/* دوران */

renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 1
        ){

            dragging =
                true;

            lastX =
                e.touches[0].clientX;

            lastY =
                e.touches[0].clientY;

        }

        if(
            e.touches.length === 2
        ){

            oldDistance =
                getDistance(
                    e.touches
                );

        }

    },
    {passive:false}
);


/* حركة */

renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        e.preventDefault();


        if(
            e.touches.length === 1 &&
            dragging
        ){

            const x =
                e.touches[0].clientX;

            const y =
                e.touches[0].clientY;

            const dx =
                x - lastX;

            const dy =
                y - lastY;

            earth.rotation.y +=
                dx * 0.006;

            earth.rotation.x +=
                dy * 0.004;

            earth.rotation.x =
                Math.max(
                    -1.25,
                    Math.min(
                        1.25,
                        earth.rotation.x
                    )
                );

            lastX = x;
            lastY = y;

        }


        if(
            e.touches.length === 2
        ){

            const d =
                getDistance(
                    e.touches
                );

            if(
                oldDistance !== null
            ){

                distance -=
                    (d - oldDistance)
                    * 0.018;

                distance =
                    Math.max(
                        7,
                        Math.min(
                            20,
                            distance
                        )
                    );

                camera.position.z =
                    distance;

            }

            oldDistance =
                d;

        }

    },
    {passive:false}
);


/* نهاية اللمس */

renderer.domElement.addEventListener(
    "touchend",
    function(e){

        if(
            e.touches.length === 0
        ){

            dragging =
                false;

        }

        if(
            e.touches.length < 2
        ){

            oldDistance =
                null;

        }

    }
);


/* =====================================================
   حساب المسافة بين إصبعين
===================================================== */

function getDistance(t){

    const dx =
        t[0].clientX -
        t[1].clientX;

    const dy =
        t[0].clientY -
        t[1].clientY;

    return Math.sqrt(
        dx*dx +
        dy*dy
    );

}


/* =====================================================
   التشغيل
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    if(
        !dragging
    ){

        earth.rotation.y +=
            0.0005;

    }

    stars.rotation.y +=
        0.00003;

    atmosphere.rotation.copy(
        earth.rotation
    );

    glow.rotation.copy(
        earth.rotation
    );

    renderer.render(
        scene,
        camera
    );

}

animate();


/* =====================================================
   تغيير حجم الشاشة
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
    </html>

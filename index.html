<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Earth Circle High Detail</title>

<style>

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#071522;
}

#earth{
    width:100%;
    height:100%;
    touch-action:none;
}

canvas{
    display:block;
}

</style>
</head>

<body>

<div id="earth"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =====================================================
   المشهد
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x071522);


/* =====================================================
   الكاميرا
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

let cameraDistance = 10;

camera.position.set(
    0,
    0,
    cameraDistance
);

camera.lookAt(
    0,
    0,
    0
);


/* =====================================================
   Renderer
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        3
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("earth")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   خريطة عالية الدقة
===================================================== */

const mapCanvas =
    document.createElement("canvas");

mapCanvas.width =
    4096;

mapCanvas.height =
    4096;

const ctx =
    mapCanvas.getContext(
        "2d"
    );


/* =====================================================
   خلفية البحر
===================================================== */

const ocean =
    ctx.createRadialGradient(
        1500,
        1200,
        100,
        2048,
        2048,
        3000
    );

ocean.addColorStop(
    0,
    "#21b8e8"
);

ocean.addColorStop(
    0.25,
    "#0d91c5"
);

ocean.addColorStop(
    0.50,
    "#0873a5"
);

ocean.addColorStop(
    0.75,
    "#04547c"
);

ocean.addColorStop(
    1,
    "#022d4b"
);

ctx.fillStyle =
    ocean;

ctx.fillRect(
    0,
    0,
    4096,
    4096
);


/* =====================================================
   مركز الدائرة
===================================================== */

const centerX =
    2048;

const centerY =
    2048;

const radius =
    1830;


/* =====================================================
   قص كل شيء داخل الدائرة
===================================================== */

ctx.save();

ctx.beginPath();

ctx.arc(
    centerX,
    centerY,
    radius,
    0,
    Math.PI * 2
);

ctx.clip();


/* =====================================================
   القارات
===================================================== */

ctx.fillStyle =
    "#68b84f";

ctx.strokeStyle =
    "#d0e99b";

ctx.lineWidth =
    10;


/* =====================================================
   أمريكا الشمالية
===================================================== */

ctx.beginPath();

ctx.moveTo(550,1050);
ctx.lineTo(650,800);
ctx.lineTo(900,650);
ctx.lineTo(1200,700);
ctx.lineTo(1450,900);
ctx.lineTo(1500,1150);
ctx.lineTo(1320,1300);
ctx.lineTo(1100,1280);
ctx.lineTo(900,1450);
ctx.lineTo(680,1350);
ctx.lineTo(500,1200);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* =====================================================
   أمريكا الجنوبية
===================================================== */

ctx.beginPath();

ctx.moveTo(1500,1600);
ctx.lineTo(1720,1650);
ctx.lineTo(1870,1900);
ctx.lineTo(1800,2250);
ctx.lineTo(1680,2600);
ctx.lineTo(1480,2900);
ctx.lineTo(1320,2650);
ctx.lineTo(1280,2350);
ctx.lineTo(1340,2000);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* =====================================================
   أوروبا
===================================================== */

ctx.beginPath();

ctx.moveTo(1850,1050);
ctx.lineTo(2050,900);
ctx.lineTo(2350,930);
ctx.lineTo(2500,1080);
ctx.lineTo(2380,1220);
ctx.lineTo(2150,1200);
ctx.lineTo(1950,1160);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* =====================================================
   آسيا
===================================================== */

ctx.beginPath();

ctx.moveTo(2300,950);
ctx.lineTo(2700,820);
ctx.lineTo(3200,900);
ctx.lineTo(3600,1120);
ctx.lineTo(3780,1400);
ctx.lineTo(3600,1600);
ctx.lineTo(3250,1580);
ctx.lineTo(2950,1450);
ctx.lineTo(2600,1350);
ctx.lineTo(2400,1200);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* =====================================================
   أفريقيا
===================================================== */

ctx.beginPath();

ctx.moveTo(2050,1450);
ctx.lineTo(2300,1500);
ctx.lineTo(2450,1800);
ctx.lineTo(2380,2200);
ctx.lineTo(2200,2600);
ctx.lineTo(1950,2800);
ctx.lineTo(1750,2550);
ctx.lineTo(1700,2200);
ctx.lineTo(1800,1800);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* =====================================================
   أستراليا
===================================================== */

ctx.beginPath();

ctx.moveTo(2850,2750);
ctx.lineTo(3250,2670);
ctx.lineTo(3600,2820);
ctx.lineTo(3650,3100);
ctx.lineTo(3400,3300);
ctx.lineTo(3050,3260);
ctx.lineTo(2800,3050);

ctx.closePath();

ctx.fill();
ctx.stroke();


/* =====================================================
   الجزر
===================================================== */

ctx.fillStyle =
    "#78c45b";

ctx.strokeStyle =
    "#d0e99b";

ctx.lineWidth =
    8;


function island(
    x,
    y,
    rx,
    ry
){

    ctx.beginPath();

    ctx.ellipse(
        x,
        y,
        rx,
        ry,
        0,
        0,
        Math.PI * 2
    );

    ctx.fill();
    ctx.stroke();

}


/* بريطانيا */

island(
    1800,
    900,
    55,
    100
);


/* أيسلندا */

island(
    1550,
    650,
    90,
    50
);


/* اليابان */

island(
    3500,
    1500,
    55,
    130
);


/* مدغشقر */

island(
    2650,
    2750,
    70,
    180
);


/* نيوزيلندا */

island(
    3650,
    3450,
    50,
    130
);


/* =====================================================
   خطوط المحيط
===================================================== */

ctx.strokeStyle =
    "rgba(220,245,255,0.16)";

ctx.lineWidth =
    5;


/* خطوط أفقية */

for(
    let y = 500;
    y < 3600;
    y += 300
){

    ctx.beginPath();

    ctx.moveTo(
        150,
        y
    );

    ctx.lineTo(
        3950,
        y
    );

    ctx.stroke();

}


/* خطوط عمودية */

for(
    let x = 500;
    x < 3600;
    x += 300
){

    ctx.beginPath();

    ctx.moveTo(
        x,
        150
    );

    ctx.lineTo(
        x,
        3950
    );

    ctx.stroke();

}


ctx.restore();


/* =====================================================
   لمعان البحر
===================================================== */

ctx.save();

ctx.beginPath();

ctx.arc(
    centerX,
    centerY,
    radius,
    0,
    Math.PI * 2
);

ctx.clip();

const shine =
    ctx.createRadialGradient(
        1250,
        950,
        80,
        1250,
        950,
        2100
    );

shine.addColorStop(
    0,
    "rgba(255,255,255,0.22)"
);

shine.addColorStop(
    0.35,
    "rgba(255,255,255,0.08)"
);

shine.addColorStop(
    0.7,
    "rgba(255,255,255,0.02)"
);

shine.addColorStop(
    1,
    "rgba(255,255,255,0)"
);

ctx.fillStyle =
    shine;

ctx.fillRect(
    0,
    0,
    4096,
    4096
);

ctx.restore();


/* =====================================================
   Texture
===================================================== */

const texture =
    new THREE.CanvasTexture(
        mapCanvas
    );

texture.colorSpace =
    THREE.SRGBColorSpace;

texture.anisotropy =
    renderer
        .capabilities
        .getMaxAnisotropy();

texture.minFilter =
    THREE.LinearMipmapLinearFilter;

texture.magFilter =
    THREE.LinearFilter;


/* =====================================================
   الدائرة
===================================================== */

const geometry =
    new THREE.CircleGeometry(
        5,
        512
    );

const material =
    new THREE.MeshBasicMaterial({
        map:texture,
        side:THREE.DoubleSide
    });

const earth =
    new THREE.Mesh(
        geometry,
        material
    );

scene.add(
    earth
);


/* =====================================================
   الحافة البيضاء
===================================================== */

const borderGeometry =
    new THREE.RingGeometry(
        5.00,
        5.065,
        512
    );

const borderMaterial =
    new THREE.MeshBasicMaterial({
        color:0xffffff,
        side:THREE.DoubleSide
    });

const border =
    new THREE.Mesh(
        borderGeometry,
        borderMaterial
    );

border.position.z =
    0.03;

scene.add(
    border
);


/* =====================================================
   الدوران الأفقي فقط
===================================================== */

let dragging =
    false;

let previousX =
    0;

let rotation =
    0;


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 1
        ){

            dragging =
                true;

            previousX =
                e.touches[0].clientX;

        }

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            !dragging ||
            e.touches.length !== 1
        ){
            return;
        }

        e.preventDefault();

        const x =
            e.touches[0].clientX;

        const dx =
            x - previousX;

        rotation +=
            dx * 0.005;

        earth.rotation.z =
            rotation;

        border.rotation.z =
            rotation;

        previousX =
            x;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchend",
    function(){

        dragging =
            false;

    }
);


/* =====================================================
   الزوم — مدى أكبر
===================================================== */

let oldDistance =
    null;


function getDistance(
    touches
){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 2
        ){

            oldDistance =
                getDistance(
                    e.touches
                );

        }

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            e.touches.length !== 2
        ){
            return;
        }

        e.preventDefault();

        const distance =
            getDistance(
                e.touches
            );

        if(
            oldDistance !== null
        ){

            cameraDistance -=
                (
                    distance -
                    oldDistance
                ) * 0.020;


            cameraDistance =
                Math.max(
                    6,
                    Math.min(
                        35,
                        cameraDistance
                    )
                );


            camera.position.z =
                cameraDistance;

        }

        oldDistance =
            distance;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchend",
    function(e){

        if(
            e.touches.length < 2
        ){

            oldDistance =
                null;

        }

    }
);


/* =====================================================
   تغيير حجم الشاشة
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   التشغيل
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=5.0,
      user-scalable=yes">

<title>الأرض - خريطة ثلاثية الأبعاد</title>

<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #071522;
    font-family: Arial, sans-serif;
}

#map {
    width: 100%;
    height: 100%;
    touch-action: none;
}

svg {
    width: 100%;
    height: 100%;
    display: block;
}

.ocean {
    fill: #087bb5;
}

.ocean-inner {
    fill: #0b8dca;
}

.land {
    fill: #5fae3e;
    stroke: #d7efb0;
    stroke-width: 0.7;
    vector-effect: non-scaling-stroke;
}

.graticule {
    fill: none;
    stroke: rgba(255,255,255,0.18);
    stroke-width: 0.6;
    vector-effect: non-scaling-stroke;
}

.border {
    fill: none;
    stroke: white;
    stroke-width: 3;
    vector-effect: non-scaling-stroke;
}

#loading {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    padding: 14px 20px;
    border-radius: 12px;
    background: rgba(0,0,0,0.75);
    color: white;
    font-size: 17px;
    z-index: 20;
}

#error {
    display: none;
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 80%;
    max-width: 420px;
    padding: 18px;
    border-radius: 14px;
    background: rgba(120,0,0,0.9);
    color: white;
    text-align: center;
    z-index: 30;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="loading">
    جاري تحميل القارات...
</div>

<div id="error">
    تعذر تحميل بيانات القارات.<br>
    تأكد من اتصال الإنترنت ثم أعد تحميل الصفحة.
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

<script>

const map = document.getElementById("map");
const loading = document.getElementById("loading");
const errorBox = document.getElementById("error");

let width = window.innerWidth;
let height = window.innerHeight;

const svg = d3.select("#map")
    .append("svg")
    .attr("viewBox", `0 0 ${width} ${height}`)
    .attr("preserveAspectRatio", "xMidYMid meet");

const root = svg.append("g");

const ocean = root.append("circle")
    .attr("class", "ocean");

const oceanInner = root.append("circle")
    .attr("class", "ocean-inner");

const grid = root.append("path")
    .attr("class", "graticule");

const landGroup = root.append("g");

const border = root.append("circle")
    .attr("class", "border");

let centerX = width / 2;
let centerY = height / 2;

let radius = Math.min(width, height) * 0.38;

function resizeMap() {

    width = window.innerWidth;
    height = window.innerHeight;

    centerX = width / 2;
    centerY = height / 2;

    radius = Math.min(width, height) * 0.38;

    svg.attr("viewBox", `0 0 ${width} ${height}`);

    ocean
        .attr("cx", centerX)
        .attr("cy", centerY)
        .attr("r", radius);

    oceanInner
        .attr("cx", centerX)
        .attr("cy", centerY)
        .attr("r", radius * 0.965);

    border
        .attr("cx", centerX)
        .attr("cy", centerY)
        .attr("r", radius);

    projection
        .translate([centerX, centerY])
        .scale(radius);

    drawGrid();

    if (landData) {
        drawLand();
    }
}

const projection = d3.geoAzimuthalEquidistant()
    .rotate([0, -90])
    .center([0, 0])
    .translate([centerX, centerY])
    .scale(radius);

const path = d3.geoPath(projection);

const graticule = d3.geoGraticule()
    .step([15, 15]);

function drawGrid() {

    grid
        .datum(graticule())
        .attr("d", path);
}

let landData = null;

function drawLand() {

    landGroup
        .selectAll("path")
        .data([landData])
        .join("path")
        .attr("class", "land")
        .attr("d", path);
}

/* =========================
   تحميل البيانات الجغرافية
   ========================= */

async function loadEarth() {

    try {

        const controller = new AbortController();

        const timeout = setTimeout(() => {
            controller.abort();
        }, 15000);

        const response = await fetch(
            "https://cdn.jsdelivr.net/npm/world-atlas@2/land-50m.json",
            {
                signal: controller.signal,
                cache: "force-cache"
            }
        );

        clearTimeout(timeout);

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const world = await response.json();

        if (!world.objects || !world.objects.land) {
            throw new Error("بيانات القارات غير موجودة");
        }

        landData = topojson.feature(
            world,
            world.objects.land
        );

        resizeMap();

        loading.style.display = "none";

    } catch (err) {

        console.error(err);

        loading.style.display = "none";
        errorBox.style.display = "block";
    }
}

/* =========================
   التكبير والتصغير
   ========================= */

let zoomLevel = 1;

const zoom = d3.zoom()
    .scaleExtent([0.35, 3.5])
    .on("zoom", function(event) {

        zoomLevel = event.transform.k;

        root.attr(
            "transform",
            `translate(${event.transform.x},
                       ${event.transform.y})
             scale(${event.transform.k})`
        );
    });

svg.call(zoom);

/* منع الدوران */
svg.on("dblclick.zoom", null);

/* بداية أصغر */
svg.call(
    zoom.transform,
    d3.zoomIdentity
        .translate(centerX, centerY)
        .scale(0.78)
        .translate(-centerX, -centerY)
);

/* =========================
   تشغيل
   ========================= */

window.addEventListener("resize", resizeMap);

resizeMap();
loadEarth();

</script>

</body>
</html>

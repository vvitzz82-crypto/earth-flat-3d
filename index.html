<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Earth Graphic Map</title>

<style>

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#020914;
}

#earth{
    width:100%;
    height:100%;
    touch-action:none;
}

canvas{
    display:block;
}

</style>
</head>

<body>

<div id="earth"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>

<script>

/* =====================================================
   المشهد
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x020914);


/* =====================================================
   الكاميرا
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        42,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1000
    );

let cameraDistance = 12;

camera.position.set(
    0,
    0,
    cameraDistance
);

camera.lookAt(0,0,0);


/* =====================================================
   Renderer
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("earth")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   النجوم
===================================================== */

const starGeometry =
    new THREE.BufferGeometry();

const starCount = 2500;

const starPositions =
    new Float32Array(
        starCount * 3
    );

for(
    let i=0;
    i<starCount;
    i++
){

    const radius =
        70 + Math.random()*80;

    const theta =
        Math.random()*Math.PI*2;

    const phi =
        Math.acos(
            2*Math.random()-1
        );

    starPositions[i*3] =
        radius *
        Math.sin(phi) *
        Math.cos(theta);

    starPositions[i*3+1] =
        radius *
        Math.sin(phi) *
        Math.sin(theta);

    starPositions[i*3+2] =
        radius *
        Math.cos(phi);
}

starGeometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
        starPositions,
        3
    )
);

const starMaterial =
    new THREE.PointsMaterial({
        color:0xffffff,
        size:0.12,
        transparent:true,
        opacity:0.8
    });

const stars =
    new THREE.Points(
        starGeometry,
        starMaterial
    );

scene.add(stars);


/* =====================================================
   خريطة العالم
===================================================== */

const mapCanvas =
    document.createElement("canvas");

mapCanvas.width = 4096;
mapCanvas.height = 2048;

const ctx =
    mapCanvas.getContext("2d");


/* =====================================================
   البحر
===================================================== */

const ocean =
    ctx.createLinearGradient(
        0,
        0,
        0,
        mapCanvas.height
    );

ocean.addColorStop(
    0,
    "#0b6d99"
);

ocean.addColorStop(
    0.25,
    "#075b85"
);

ocean.addColorStop(
    0.55,
    "#063f68"
);

ocean.addColorStop(
    0.8,
    "#052d50"
);

ocean.addColorStop(
    1,
    "#021d38"
);

ctx.fillStyle =
    ocean;

ctx.fillRect(
    0,
    0,
    mapCanvas.width,
    mapCanvas.height
);


/* =====================================================
   إسقاط الخريطة
===================================================== */

const projection =
    d3.geoEquirectangular()
      .scale(
          mapCanvas.width /
          (2*Math.PI)
      )
      .translate([
          mapCanvas.width/2,
          mapCanvas.height/2
      ]);


/* =====================================================
   خطوط الطول والعرض
===================================================== */

const path =
    d3.geoPath(
        projection,
        ctx
    );

ctx.save();

ctx.strokeStyle =
    "rgba(150,220,255,0.13)";

ctx.lineWidth = 2;

path(
    d3.geoGraticule10()
);

ctx.stroke();

ctx.restore();


/* =====================================================
   Texture
===================================================== */

const texture =
    new THREE.CanvasTexture(
        mapCanvas
    );

texture.colorSpace =
    THREE.SRGBColorSpace;


/* =====================================================
   تحميل القارات والدول
===================================================== */

fetch(
    "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
)

.then(
    response =>
        response.json()
)

.then(
    world =>
{

    const countries =
        topojson.feature(
            world,
            world.objects.countries
        );


    /* =================================================
       اليابسة والحدود
    ================================================= */

    ctx.save();

    ctx.fillStyle =
        "#4f9f4a";

    ctx.strokeStyle =
        "rgba(190,240,170,0.75)";

    ctx.lineWidth =
        2.2;


    countries.features.forEach(
        country =>
        {

            ctx.beginPath();

            path(country);

            ctx.fill();

            ctx.stroke();

        }
    );

    ctx.restore();


    /* =================================================
       لمعة على الأرض
    ================================================= */

    const landLight =
        ctx.createRadialGradient(
            1450,
            650,
            50,
            1450,
            650,
            1500
        );

    landLight.addColorStop(
        0,
        "rgba(255,255,220,0.25)"
    );

    landLight.addColorStop(
        0.45,
        "rgba(255,255,255,0.07)"
    );

    landLight.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.fillStyle =
        landLight;

    ctx.fillRect(
        0,
        0,
        mapCanvas.width,
        mapCanvas.height
    );


    texture.needsUpdate =
        true;

});


/* =====================================================
   الأرض
===================================================== */

const earthGeometry =
    new THREE.SphereGeometry(
        5,
        192,
        192
    );


const earthMaterial =
    new THREE.MeshPhongMaterial({

        map:texture,

        shininess:18,

        specular:
            new THREE.Color(
                0x164c68
            )

    });


const earth =
    new THREE.Mesh(
        earthGeometry,
        earthMaterial
    );

scene.add(
    earth
);


/* =====================================================
   ضوء الشمس
===================================================== */

const sunLight =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

sunLight.position.set(
    8,
    5,
    8
);

scene.add(
    sunLight
);


/* =====================================================
   إضاءة عامة
===================================================== */

const ambient =
    new THREE.AmbientLight(
        0x447799,
        0.45
    );

scene.add(
    ambient
);


/* =====================================================
   الغلاف الجوي
===================================================== */

const atmosphereGeometry =
    new THREE.SphereGeometry(
        5.12,
        192,
        192
    );


const atmosphereMaterial =
    new THREE.ShaderMaterial({

        transparent:true,

        side:
            THREE.BackSide,

        blending:
            THREE.AdditiveBlending,

        uniforms:{
            glowColor:{
                value:
                    new THREE.Color(
                        0x2bbcff
                    )
            }
        },

        vertexShader:`

            varying vec3 vNormal;

            void main(){

                vNormal =
                    normalize(
                        normalMatrix *
                        normal
                    );

                gl_Position =
                    projectionMatrix *
                    modelViewMatrix *
                    vec4(
                        position,
                        1.0
                    );
            }

        `,

        fragmentShader:`

            varying vec3 vNormal;

            uniform vec3 glowColor;

            void main(){

                float intensity =
                    pow(
                        0.65 -
                        dot(
                            vNormal,
                            vec3(
                                0.0,
                                0.0,
                                1.0
                            )
                        ),
                        3.0
                    );

                gl_FragColor =
                    vec4(
                        glowColor,
                        intensity
                    );
            }

        `
    });


const atmosphere =
    new THREE.Mesh(
        atmosphereGeometry,
        atmosphereMaterial
    );

scene.add(
    atmosphere
);


/* =====================================================
   لمس ودوران
===================================================== */

let dragging =
    false;

let previousX = 0;
let previousY = 0;

let velocityX = 0;
let velocityY = 0;


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 1
        ){

            dragging =
                true;

            previousX =
                e.touches[0].clientX;

            previousY =
                e.touches[0].clientY;

        }

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            !dragging ||
            e.touches.length !== 1
        ){
            return;
        }

        e.preventDefault();

        const x =
            e.touches[0].clientX;

        const y =
            e.touches[0].clientY;

        const dx =
            x - previousX;

        const dy =
            y - previousY;


        velocityX =
            dx * 0.006;

        velocityY =
            dy * 0.006;


        earth.rotation.y +=
            velocityX;

        earth.rotation.x +=
            velocityY;


        earth.rotation.x =
            Math.max(
                -1.35,
                Math.min(
                    1.35,
                    earth.rotation.x
                )
            );


        previousX = x;
        previousY = y;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchend",
    function(){

        dragging =
            false;

    }
);


/* =====================================================
   التكبير بإصبعين
===================================================== */

let oldDistance =
    null;


function getDistance(touches){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx*dx + dy*dy
    );
}


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 2
        ){

            oldDistance =
                getDistance(
                    e.touches
                );

        }

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            e.touches.length !== 2
        ){
            return;
        }

        e.preventDefault();

        const distance =
            getDistance(
                e.touches
            );


        if(
            oldDistance !== null
        ){

            cameraDistance -=
                (
                    distance -
                    oldDistance
                ) * 0.018;


            cameraDistance =
                Math.max(
                    7,
                    Math.min(
                        22,
                        cameraDistance
                    )
                );


            camera.position.z =
                cameraDistance;

        }


        oldDistance =
            distance;

    },
    {passive:false}
);


renderer.domElement.addEventListener(
    "touchend",
    function(e){

        if(
            e.touches.length < 2
        ){

            oldDistance =
                null;

        }

    }
);


/* =====================================================
   التشغيل
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    if(!dragging){

        earth.rotation.y +=
            0.0007;

    }


    stars.rotation.y +=
        0.00005;


    atmosphere.rotation.y =
        earth.rotation.y;


    renderer.render(
        scene,
        camera
    );

}


animate();


/* =====================================================
   تغيير حجم الشاشة
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>

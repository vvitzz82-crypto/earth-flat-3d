<!DOCTYPE html>
<html lang="ar">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Earth Flat Map 10m</title>

<style>

html,body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    background:#071522;
}

#earth{
    width:100%;
    height:100%;
    touch-action:none;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:10;

    padding:12px 18px;
    border-radius:12px;

    background:rgba(0,0,0,0.55);
    color:#ffffff;

    font-family:Arial,sans-serif;
    font-size:16px;

    white-space:nowrap;
}

</style>
</head>

<body>

<div id="earth"></div>

<div id="loading">
جاري تحميل القارات...
</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/d3-geo@3"></script>


<script>

/* =====================================================
   المشهد
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x071522
    );


/* =====================================================
   الكاميرا
===================================================== */

const camera =
    new THREE.PerspectiveCamera(
        45,
        window.innerWidth /
        window.innerHeight,
        0.1,
        100
    );

let cameraDistance = 10;

camera.position.set(
    0,
    0,
    cameraDistance
);

camera.lookAt(
    0,
    0,
    0
);


/* =====================================================
   Renderer
===================================================== */

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        3
    )
);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document
    .getElementById("earth")
    .appendChild(
        renderer.domElement
    );


/* =====================================================
   لوحة الخريطة
===================================================== */

const mapCanvas =
    document.createElement(
        "canvas"
    );

mapCanvas.width =
    4096;

mapCanvas.height =
    4096;

const ctx =
    mapCanvas.getContext(
        "2d"
    );


/* =====================================================
   بحر أزرق واضح
===================================================== */

const ocean =
    ctx.createRadialGradient(
        1450,
        1000,
        100,
        2048,
        2048,
        3000
    );

ocean.addColorStop(
    0,
    "#35c8ee"
);

ocean.addColorStop(
    0.20,
    "#16a6d5"
);

ocean.addColorStop(
    0.45,
    "#0a83b2"
);

ocean.addColorStop(
    0.70,
    "#075e87"
);

ocean.addColorStop(
    1,
    "#033653"
);

ctx.fillStyle =
    ocean;

ctx.fillRect(
    0,
    0,
    4096,
    4096
);


/* =====================================================
   مركز القرص
===================================================== */

const centerX =
    2048;

const centerY =
    2048;

const discRadius =
    1900;


/* =====================================================
   قص دائري
===================================================== */

ctx.save();

ctx.beginPath();

ctx.arc(
    centerX,
    centerY,
    discRadius,
    0,
    Math.PI * 2
);

ctx.clip();


/* =====================================================
   إسقاط جغرافي قطبي
   يعطي توزيعًا قريبًا من الصورة المرجعية
===================================================== */

const projection =
    d3.geoAzimuthalEquidistant()
      .rotate([
          0,
          -90
      ])
      .translate([
          centerX,
          centerY
      ])
      .scale(
          1150
      );


/* =====================================================
   مسار الرسم
===================================================== */

const path =
    d3.geoPath(
        projection,
        ctx
    );


/* =====================================================
   شبكة خفيفة
===================================================== */

ctx.save();

ctx.strokeStyle =
    "rgba(220,245,255,0.12)";

ctx.lineWidth =
    3;

const graticule =
    d3.geoGraticule()
      .step([
          10,
          10
      ]);

ctx.beginPath();

path(
    graticule()
);

ctx.stroke();

ctx.restore();


/* =====================================================
   Texture قبل تحميل البيانات
===================================================== */

const texture =
    new THREE.CanvasTexture(
        mapCanvas
    );

texture.colorSpace =
    THREE.SRGBColorSpace;

texture.anisotropy =
    renderer
        .capabilities
        .getMaxAnisotropy();

texture.minFilter =
    THREE.LinearMipmapLinearFilter;

texture.magFilter =
    THREE.LinearFilter;


/* =====================================================
   تحميل اليابسة الحقيقية 10m
===================================================== */

fetch(
    "https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-10m.json"
)

.then(
    response => {

        if(!response.ok){

            throw new Error(
                "تعذر تحميل الخريطة"
            );

        }

        return response.json();

    }
)

.then(
    world => {

        const land =
            topojson.feature(
                world,
                world.objects.land
            );


        /* =============================================
           القارات والجزر
        ============================================= */

        ctx.save();

        ctx.fillStyle =
            "#68b64d";

        ctx.strokeStyle =
            "#d8eb9b";

        ctx.lineWidth =
            4;


        ctx.beginPath();

        path(
            land
        );

        ctx.fill();

        ctx.stroke();

        ctx.restore();


        /* =============================================
           تظليل بسيط لليابسة
        ============================================= */

        ctx.save();

        ctx.beginPath();

        path(
            land
        );

        ctx.clip();


        const landGlow =
            ctx.createRadialGradient(
                1300,
                850,
                80,
                1300,
                850,
                2100
            );

        landGlow.addColorStop(
            0,
            "rgba(255,255,220,0.28)"
        );

        landGlow.addColorStop(
            0.40,
            "rgba(255,255,255,0.08)"
        );

        landGlow.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle =
            landGlow;

        ctx.fillRect(
            0,
            0,
            4096,
            4096
        );

        ctx.restore();


        /* =============================================
           لمعان خفيف للماء
        ============================================= */

        const waterGlow =
            ctx.createRadialGradient(
                1200,
                700,
                50,
                1200,
                700,
                2300
            );

        waterGlow.addColorStop(
            0,
            "rgba(255,255,255,0.14)"
        );

        waterGlow.addColorStop(
            0.45,
            "rgba(255,255,255,0.04)"
        );

        waterGlow.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle =
            waterGlow;

        ctx.fillRect(
            0,
            0,
            4096,
            4096
        );


        ctx.restore();


        texture.needsUpdate =
            true;


        document
            .getElementById("loading")
            .style.display =
                "none";

    }
)

.catch(
    error => {

        console.error(
            error
        );

        document
            .getElementById("loading")
            .textContent =
                "تعذر تحميل القارات";

    }
);


/* =====================================================
   الدائرة المسطحة
===================================================== */

const diskGeometry =
    new THREE.CircleGeometry(
        5,
        512
    );

const diskMaterial =
    new THREE.MeshBasicMaterial({

        map:
            texture,

        side:
            THREE.DoubleSide

    });

const earth =
    new THREE.Mesh(
        diskGeometry,
        diskMaterial
    );

scene.add(
    earth
);


/* =====================================================
   الحافة البيضاء
===================================================== */

const borderGeometry =
    new THREE.RingGeometry(
        5.00,
        5.08,
        512
    );

const borderMaterial =
    new THREE.MeshBasicMaterial({

        color:
            0xffffff,

        side:
            THREE.DoubleSide

    });

const border =
    new THREE.Mesh(
        borderGeometry,
        borderMaterial
    );

border.position.z =
    0.025;

scene.add(
    border
);


/* =====================================================
   دوران أفقي فقط
===================================================== */

let dragging =
    false;

let previousX =
    0;

let rotation =
    0;


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 1
        ){

            dragging =
                true;

            previousX =
                e.touches[0].clientX;

        }

    },
    {
        passive:false
    }
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            !dragging ||
            e.touches.length !== 1
        ){
            return;
        }

        e.preventDefault();

        const x =
            e.touches[0].clientX;

        const dx =
            x - previousX;

        rotation +=
            dx * 0.005;

        earth.rotation.z =
            rotation;

        border.rotation.z =
            rotation;

        previousX =
            x;

    },
    {
        passive:false
    }
);


renderer.domElement.addEventListener(
    "touchend",
    function(){

        dragging =
            false;

    }
);


/* =====================================================
   Zoom واسع
===================================================== */

let oldDistance =
    null;


function getDistance(
    touches
){

    const dx =
        touches[0].clientX -
        touches[1].clientX;

    const dy =
        touches[0].clientY -
        touches[1].clientY;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


renderer.domElement.addEventListener(
    "touchstart",
    function(e){

        if(
            e.touches.length === 2
        ){

            oldDistance =
                getDistance(
                    e.touches
                );

        }

    },
    {
        passive:false
    }
);


renderer.domElement.addEventListener(
    "touchmove",
    function(e){

        if(
            e.touches.length !== 2
        ){
            return;
        }

        e.preventDefault();

        const newDistance =
            getDistance(
                e.touches
            );


        if(
            oldDistance !== null
        ){

            cameraDistance -=
                (
                    newDistance -
                    oldDistance
                ) * 0.020;


            cameraDistance =
                Math.max(
                    5,
                    Math.min(
                        40,
                        cameraDistance
                    )
                );


            camera.position.z =
                cameraDistance;

        }


        oldDistance =
            newDistance;

    },
    {
        passive:false
    }
);


renderer.domElement.addEventListener(
    "touchend",
    function(e){

        if(
            e.touches.length < 2
        ){

            oldDistance =
                null;

        }

    }
);


/* =====================================================
   تغيير حجم الشاشة
===================================================== */

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =====================================================
   التشغيل
===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );

    renderer.render(
        scene,
        camera
    );

}

animate();

</script>

</body>
    </html>
